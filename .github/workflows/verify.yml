name: Verify intelligent Boss Radar

on:
  push:
    branches:
      - feature/intelligent-boss-radar
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check JavaScript syntax
        run: pnpm run check
      - name: Verify intelligence integrity
        run: pnpm run check:intelligence
      - name: Run tests
        run: pnpm test
      - name: Build Cloudflare package
        run: pnpm run cloud:build
      - name: Smoke test Cloudflare package
        run: pnpm run cloud:check
      - name: Validate Wrangler package
        run: pnpm exec wrangler deploy --dry-run
